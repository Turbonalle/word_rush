<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles/menu/menu.css">
		<link rel="stylesheet" href="styles/menu/title.css">
		<link rel="stylesheet" href="styles/menu/modes.css">
		<link rel="stylesheet" href="styles/menu/story_levels.css">
		<link rel="stylesheet" href="styles/menu/options.css">
		<link rel="stylesheet" href="styles/menu/audio_player.css">
		<link rel="stylesheet" href="styles/game/game.css">
		<link rel="stylesheet" href="styles/game/timer.css">
		<link rel="stylesheet" href="styles/main.css">
		<title>WordRush</title>
	</head>
	<body>
		<div id="menu-screen">
			<div id="title-container">
				<div class="title-cell" id="t1"><span>W</span></div>
				<div class="title-cell" id="t2"><span>O</span></div>
				<div class="title-cell" id="t3"><span>R</span></div>
				<div class="title-cell" id="t4"><span>D</span></div>
				<div class="title-cell" id="t5"><span>R</span></div>
				<div class="title-cell" id="t6"><span>U</span></div>
				<div class="title-cell" id="t7"><span>S</span></div>
				<div class="title-cell" id="t8"><span>H</span></div>
			</div>
			<div id="modes-container">
				<div id="mode-button-container">
					<div id="story-mode-button" class="button mode-button">Story mode</div>
					<div id="basic-mode-button" class="button mode-button">Basic mode</div>
					<div id="panic-mode-button" class="button mode-button">Panic mode</div>
					<div id="test-mode-button" class="button mode-button">Test mode</div>
				</div>
				<div id="mode-info-container"></div>
			</div>

			<!---------------------- SETTINGS CONTAINERS ---------------------->

			<!-- Story Settings -->
			<div id="story-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="story-option-en" data-language="en" class="option-en language-button active">en</button>
						<button id="story-option-sv" data-language="sv" class="option-sv language-button">sv</button>
					</div>
				</div>
				<div class="option-row">
					<div class="option">Chapter: </div>
					<div class="option-container">
						<button class="chapter-button active" data-chapter="1">1</button>
						<button class="chapter-button" data-chapter="2">2</button>
						<button class="chapter-button" data-chapter="3">3</button>
					</div>
				</div>
				<div id="story-chapter-container">
					<div id="story-chapter-header">
						<span id="story-chapter-title"></span>
						<div id="story-chapter-requirement"></div>					
					</div>
					<div id="story-levels-container" class="story-levels-container">
						<!-- Story levels will be generated here -->
					</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
				</div>
			</div>

			<!-- Basic Settings -->
			<div id="basic-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="basic-option-en" data-language="en" class="option-en language-button active">en</button>
						<button id="basic-option-sv" data-language="sv" class="option-sv language-button">sv</button>
					</div>
				</div>
				<div class="option-row">
					<div class="option">Letters: </div>
					<div class="slider-row">
						<input id="basic-length-slider" class="length-slider" type="range" min="3" max="5" value="4">
					</div>
					<div id="basic-length-value" class="length-value">4</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
					<button class="play-button button">Play</button>
				</div>
			</div>

			<!-- Panic Settings -->
			<div id="panic-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="panic-option-en" data-language="en" class="option-en language-button active">en</button>
						<button id="panic-option-sv" data-language="sv" class="option-sv language-button">sv</button>
					</div>
				</div>
				<div class="option-row">
					<div class="option">Letters: </div>
					<div class="slider-row">
						<input id="panic-length-slider" class="length-slider" type="range" min="3" max="5" value="4">
					</div>
					<div id="panic-length-value" class="length-value">4</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
					<button class="play-button button">Play</button>
				</div>
			</div>

			<!-- Test Settings -->
			<div id="test-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="test-option-en" data-language="en" class="option-en language-button active">en</button>
						<button id="test-option-sv" data-language="sv" class="option-sv language-button">sv</button>
					</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
					<button class="play-button button">Play</button>
				</div>
			</div>
		</div>

		<!-------------------------- GAME SCREENS -------------------------->

		<!-- Story Game Screen -->
		<div id="story-game-screen" class="game-screen hidden">
			<div id="story-given-letters-container" class="given-letters-container"></div>
			<div id="progress-container">
				<span id="story-progress-text" class="progress-text">0 / 0</span>
				<div id="progress-bar-container">
					<div id="story-progress-bar" class="progress-bar"></div>
				</div>
			</div>
			<div id="story-candidate-word-container" class="candidate-word-container"></div>
			<button class="submit-button game-button">Submit word</button>
			<div id="story-found-words-container" class="found-words-container"></div>
			<div id="story-bottom-container" class="bottom-container">
				<button class="to-mode-button game-button">Mode menu</button>
				<button class="to-settings-button game-button">Settings</button>
				<button class="next-chapter-button game-button">Next chapter</button>
			</div>
		</div>

		<!-- Basic Game Screen -->
		<div id="basic-game-screen" class="game-screen hidden">
			<div id="basic-given-letters-container" class="given-letters-container"></div>
			<div id="progress-container">
				<span id="basic-progress-text" class="progress-text">0 / 0</span>
				<div id="progress-bar-container">
					<div id="basic-progress-bar" class="progress-bar"></div>
				</div>
			</div>
			<div id="basic-candidate-word-container" class="candidate-word-container"></div>
			<button class="submit-button">Submit word</button>
			<div id="basic-found-words-container" class="found-words-container"></div>
			<div id="basic-bottom-container" class="bottom-container">
				<button class="to-mode-button game-button">Mode menu</button>
				<button class="to-settings-button game-button">Settings</button>
				<button class="show-words-button game-button">Give up</button>
				<button class="new-game-button game-button">New word</button>
			</div>
		</div>

		<!-- Panic Game Screen -->
		<div id="panic-game-screen" class="game-screen hidden">
			<div id="panic-given-letters-container" class="given-letters-container"></div>
			<div id="progress-container">
				<span id="panic-progress-text" class="progress-text">0 / 0</span>
				<div id="progress-bar-container">
					<div id="panic-progress-bar" class="progress-bar"></div>
				</div>
			</div>
			<div id="panic-timer-container">
				<span id="panic-timer">0</span>
			</div>
			<div id="panic-candidate-word-container" class="candidate-word-container"></div>
			<button class="submit-button">Submit word</button>
			<div id="panic-found-words-container" class="found-words-container"></div>
			<div id="basic-bottom-container" class="bottom-container">
				<button class="to-mode-button game-button">Mode menu</button>
				<button class="to-settings-button game-button">Settings</button>
				<button class="show-words-button game-button">Give up</button>
				<button class="new-game-button game-button">New word</button>
			</div>
		</div>

		<!-- Test Game Screen -->
		<div id="test-game-screen" class="game-screen hidden">
			<div id="test-candidate-word-container" class="candidate-word-container"></div>
			<button id="test-get-answers-button">Find words</button>
			<div id="test-found-words-container" class="found-words-container"></div>
			<div id="basic-bottom-container" class="bottom-container">
				<button class="to-mode-button game-button">Mode menu</button>
				<button class="to-settings-button game-button">Settings</button>
			</div>
		</div>

		<!-------------------------- AUDIO PLAYER -------------------------->

		<div id="audio-player">
			<div id="playlist-container" class="hidden"></div>
			<div id="audio-player-header">
				<span id="song-title">No music</span>
			</div>
			<div id="audio-player-controls">
				<button id="previous-button" class="audio-button">⏮</button>
				<button id="play-button" class="audio-button">▶</button>
				<button id="stop-button" class="audio-button">⏹</button>
				<button id="next-button" class="audio-button">⏭</button>
				<button id="toggle-playlist-button" class="audio-button">▼</button>
			</div>
		</div>
	</body>
	<script type="module" src="scripts/helper_functions.js"></script>
	<script type="module" src="scripts/save.js"></script>
	<script type="module" src="scripts/AudioPlayer/playlists.js"></script>
	<script type="module" src="scripts/AudioPlayer/AudioPlayer.js"></script>
	<script type="module" src="scripts/AudioPlayer/audioplayer_buttons.js"></script>
	<script type="module" src="scripts/LevelManager.js"></script>
	<script type="module" src="scripts/DictionaryManager.js"></script>
	<script type="module" src="scripts/main.js"></script>
	<script type="module" src="scripts/Timer.js"></script>
	<script type="module" src="scripts/screen_switch.js"></script>
	<script type="module" src="scripts/mode_info.js"></script>
	<script type="module" src="scripts/reset_game.js"></script>
	<script type="module" src="scripts/key_handler.js"></script>
	<script type="module" src="scripts/game.js"></script>
	<script type="module" src="scripts/menu.js"></script>
	<script type="module" src="scripts/set_language.js"></script>
</html>
