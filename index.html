<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles/menu/menu.css">
		<link rel="stylesheet" href="styles/menu/title.css">
		<link rel="stylesheet" href="styles/menu/modes.css">
		<link rel="stylesheet" href="styles/menu/story_levels.css">
		<link rel="stylesheet" href="styles/menu/options.css">
		<link rel="stylesheet" href="styles/game/game.css">
		<link rel="stylesheet" href="styles/main.css">
		<title>WordHunt</title>
	</head>
	<body>
		<div id="menu-screen">
			<div id="title-container">
				<div class="title-cell" id="t1"><span>W</span></div>
				<div class="title-cell" id="t2"><span>O</span></div>
				<div class="title-cell" id="t3"><span>R</span></div>
				<div class="title-cell" id="t4"><span>D</span></div>
				<div class="title-cell" id="t5"><span>R</span></div>
				<div class="title-cell" id="t6"><span>U</span></div>
				<div class="title-cell" id="t7"><span>S</span></div>
				<div class="title-cell" id="t8"><span>H</span></div>
			</div>
			<div id="modes-container">
				<div id="mode-button-container">
					<div id="story-mode-button" class="button mode-button">Story mode</div>
					<div id="basic-mode-button" class="button mode-button">Basic mode</div>
					<div id="panic-mode-button" class="button mode-button">Panic mode</div>
					<div id="test-mode-button" class="button mode-button">Test mode</div>
				</div>
				<div id="mode-info-container"></div>
			</div>

			<!-- Settings Containers -->
			<div id="story-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="option-en" class="option-box active">en</button>
						<button id="option-sv" class="option-box">sv</button>
					</div>
				</div>
				<div id="story-levels-container" class="story-levels-container">
					<div class="story-level-container">
						<div class="level-button">
							<div class="level-progress-fill"></div>
							<span class="level-button-number">1</span>
							<span class="level-button-title">OST</span>
							<span class="level-button-progress">0 / 5</span>
						</div>
						<div class="story-level-stars-container">
							<svg class="star filled" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5-4.8-4.6 6.6-.9L12 2.5z"/></svg>
							<svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5-4.8-4.6 6.6-.9L12 2.5z"/></svg>
							<svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5-4.8-4.6 6.6-.9L12 2.5z"/></svg>
							<svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5-4.8-4.6 6.6-.9L12 2.5z"/></svg>
							<svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5-4.8-4.6 6.6-.9L12 2.5z"/></svg>
						</div>
					</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
				</div>
			</div>

			<div id="basic-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="option-en" class="option-box active">en</button>
						<button id="option-sv" class="option-box">sv</button>
					</div>
				</div>
				<div class="option-row">
					<div class="option">Letters: </div>
					<div class="slider-row">
						<input id="length-slider" type="range" min="3" max="10" value="6">
					</div>
					<div id="length-value">6</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
					<button class="play-button button">Play</button>
				</div>
			</div>

			<div id="panic-settings-container" class="settings-container hidden">
				<div class="option-row">
					<div class="option">Language: </div>
					<div class="option-container">
						<button id="option-en" class="option-box active">en</button>
						<button id="option-sv" class="option-box">sv</button>
					</div>
				</div>
				<div class="option-row">
					<div class="option">Letters: </div>
					<div class="slider-row">
						<input id="length-slider" type="range" min="3" max="10" value="6">
					</div>
					<div id="length-value">6</div>
				</div>
				<div class="buttons-container">
					<button class="back-button button">Back</button>
					<button class="play-button button">Play</button>
				</div>
			</div>

			<div id="test-settings-container" class="settings-container hidden">
				<div class="buttons-container">
					<button class="back-button button">Back</button>
					<button class="play-button button">Play</button>
				</div>
			</div>
		</div>

		<!-- Game Screens -->
		<div id="story-game-screen" class="game-screen hidden">
			<div id="story-given-letters-container" class="given-letters-container"></div>
			<div id="progress-container">
				<span id="story-progress-text" class="progress-text">0 / 0</span>
				<div id="progress-bar-container">
					<div id="story-progress-bar" class="progress-bar"></div>
				</div>
			</div>
			<div id="story-candidate-word-container" class="candidate-word-container"></div>
			<button class="submit-button">Submit word</button>
			<div id="story-found-words-container" class="found-words-container"></div>
			<button class="backtomenu-button">Back</button>
		</div>

		<div id="basic-game-screen" class="game-screen hidden">
			<div id="basic-given-letters-container" class="given-letters-container"></div>
			<div id="progress-container">
				<span id="basic-progress-text" class="progress-text">0 / 0</span>
				<div id="progress-bar-container">
					<div id="basic-progress-bar" class="progress-bar"></div>
				</div>
			</div>
			<div id="basic-candidate-word-container" class="candidate-word-container"></div>
			<button class="submit-button">Submit word</button>
			<div id="basic-found-words-container" class="found-words-container"></div>
			<button class="backtomenu-button">Back</button>
		</div>

		<div id="panic-game-screen" class="game-screen hidden">
			<div id="panic-given-letters-container" class="given-letters-container"></div>
			<div id="progress-container">
				<span id="panic-progress-text" class="progress-text">0 / 0</span>
				<div id="progress-bar-container">
					<div id="panic-progress-bar" class="progress-bar"></div>
				</div>
			</div>
			<div id="panic-candidate-word-container" class="candidate-word-container"></div>
			<button class="submit-button">Submit word</button>
			<div id="panic-found-words-container" class="found-words-container"></div>
			<button class="backtomenu-button">Back</button>
		</div>

		<div id="test-game-screen" class="game-screen hidden">
			<div id="test-candidate-word-container" class="candidate-word-container"></div>
			<button id="get-answers-button">Find words</button>
			<div id="test-found-words-container" class="found-words-container"></div>
			<button class="backtomenu-button">Back</button>
		</div>
	</body>
	<script type="module" src="scripts/main.js"></script>
	<script type="module" src="scripts/level_manager.js"></script>
	<script type="module" src="scripts/screen_switch.js"></script>
	<script type="module" src="scripts/mode_info.js"></script>
	<script type="module" src="scripts/reset_game.js"></script>
	<script type="module" src="scripts/key_handler.js"></script>
	<script type="module" src="scripts/game.js"></script>
	<script type="module" src="scripts/menu.js"></script>
</html>
